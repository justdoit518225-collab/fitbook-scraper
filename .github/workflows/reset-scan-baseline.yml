# 每週一 08:00（台北）清空掃描歷史並以當次掃描為新的比對基準
# 基準存在試算表 _scan_baseline 分頁，不再使用 Actions Cache。

name: FitBook Weekly Reset

on:
  schedule:
    - cron: "0 8 * * 1"
      timezone: Asia/Taipei
  workflow_dispatch:

concurrency:
  group: fitbook-scrape
  cancel-in-progress: false

jobs:
  reset-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Prepare config and service account
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python deploy/github_actions/prepare_ci.py

      - name: Run scraper (reset baseline)
        env:
          FITBOOK_COOKIE: ${{ secrets.FITBOOK_COOKIE }}
        run: python scrape_fitbook.py --reset-baseline
