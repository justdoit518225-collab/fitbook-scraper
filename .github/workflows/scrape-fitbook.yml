# FitBook 爬蟲：每 10 分鐘定時寫入 Google 試算表
# 比對基準存在試算表 _scan_baseline 分頁，不再使用 Actions Cache。

name: FitBook Scrape

on:
  schedule:
    # 每 10 分鐘（台灣時間）：:00、:10、:20…
    - cron: "*/10 * * * *"
      timezone: "Asia/Taipei"
  workflow_dispatch:

concurrency:
  group: fitbook-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Taipei

    steps:
      - name: Log schedule time (Taipei)
        run: |
          echo "Workflow TZ=${TZ}"
          date '+%Y-%m-%d %H:%M:%S %Z (%A)'

      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Prepare config and service account
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python deploy/github_actions/prepare_ci.py

      - name: Run scraper
        env:
          FITBOOK_COOKIE: ${{ secrets.FITBOOK_COOKIE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USE_BROADCAST: "true"
        run: python scrape_fitbook.py
