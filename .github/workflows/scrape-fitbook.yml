# FitBook 爬蟲：每小時定時寫入 Google 試算表
# 比對基準存在試算表 _scan_baseline 分頁，不再使用 Actions Cache。

name: FitBook Scrape

on:
  schedule:
    - cron: "50 * * * *"
      timezone: Asia/Taipei
  workflow_dispatch:

concurrency:
  group: fitbook-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Prepare config and service account
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python deploy/github_actions/prepare_ci.py

      - name: Run scraper
        env:
          FITBOOK_COOKIE: ${{ secrets.FITBOOK_COOKIE }}
        run: python scrape_fitbook.py
