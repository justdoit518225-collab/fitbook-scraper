# FitBook 爬蟲：定時寫入 Google 試算表（無需本機電腦常開）
# 機密請放在 GitHub Secrets，勿寫入程式碼。

name: FitBook Scrape

on:
  schedule:
    # 每小時第 50 分（台北時間）
    - cron: "50 * * * *"
      timezone: Asia/Taipei
  workflow_dispatch:

concurrency:
  group: fitbook-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore last scan state
        id: restore-state
        uses: actions/cache/restore@v5
        with:
          path: last_scan_state.json
          key: fitbook-last-scan-v2
          restore-keys: |
            fitbook-last-scan-

      - name: Prepare config and service account
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python deploy/github_actions/prepare_ci.py

      - name: Run scraper
        id: scrape
        env:
          FITBOOK_COOKIE: ${{ secrets.FITBOOK_COOKIE }}
        run: python scrape_fitbook.py

      - name: Save last scan state
        uses: actions/cache/save@v5
        if: steps.scrape.outcome == 'success' && hashFiles('last_scan_state.json') != ''
        with:
          path: last_scan_state.json
          key: fitbook-last-scan-v2
